# Settings read by scripts/emr/lib-emr.sh (conf_value). KEY=VALUE, never sourced.
# Uploaded to bootstrap/spark-yarn.conf by scripts/upload-inputs.sh and copied to the
# node by the fetch step. Edit it (a reviewed change) after reading capability.json.

# spark.yarn.populateHadoopClasspath for the pipeline. The capability check tests both;
# false keeps EMR's Hadoop 3.4.1 and EMR library directories off the Spark 4 containers.
POPULATE_HADOOP_CLASSPATH=false

# client keeps the driver on the primary node, where its output is in the step log.
DEPLOY_MODE=client

# m5.xlarge has 4 vCPUs and 15,791 MB and also runs the Hadoop daemons, and the client
# mode driver runs on the same node. Work order 49: two executors of 2 cores use all 4
# vCPUs (S run 3 used one executor, 2 of 4). Memory, per YARN container (heap plus
# the default overhead of max(384 MB, 10 percent)):
#   executor 3g = 3072 + 384 = 3456 MB, two = 6912 MB
#   application master 1g = 1024 + 384 = 1408 MB
#   total asked of the node manager 8320 MB. S run 3 saw one 4g executor container of
#   4505 MB. The node manager limit is not read here (EMR's m5.xlarge default is
#   believed to be 12288 MB, UNVERIFIED on this node); 8320 fits under it, and
#   under any limit of 8320 MB or more. The driver (2g) and the daemons share the
#   rest of the 15,791 MB, which is why the executors are 3g and not 4g: two 4g
#   containers (9010 MB) plus the AM (1408 MB) would ask 10,418 MB and leave too little
#   for the driver and the daemons. If the limit is lower than 8320 MB, set
#   EXECUTOR_MEMORY=2g (two containers 4864 MB plus the AM, 6272 MB).
DRIVER_MEMORY=2g
AM_MEMORY=1g
EXECUTOR_MEMORY=3g
EXECUTOR_CORES=2
EXECUTOR_INSTANCES=2

# Phase 15 (Experiments A and B). Every key below is optional; the value shown is the
# behaviour before Phase 15.
# Lines of the form <profile>.KEY=VALUE apply only when the state machine passes that
# profile to run-s-pipeline.sh (Terraform variable pipeline_profile, set by the overlays
# baseline-s.tfvars and elasticity-s.tfvars); they win over the plain KEY line.

# Number of Spark shuffle partitions, passed as --partitions to CollaborationPipeline
# (its own default is 8, range 1 to 10000).
SHUFFLE_PARTITIONS=8

# Where the MapReduce containers read and write: auto (HDFS when the cluster has a YARN
# node other than the primary, else file:/// on the primary), file, or hdfs.
DATA_PATH=auto

# Seconds to wait for a NodeManager on another host when DATA_PATH=hdfs is forced (by a
# profile line). The cluster launch returns once the cluster is WAITING, so this is
# normally immediate. 0 = no wait. Not used for auto or file.
NM_WAIT_SECONDS=300

# Where the two Spark applications run: auto (local[N] on the primary when the cluster
# has a YARN node other than the primary, else yarn), yarn, or local. A local master is
# needed because the applications read and write file: paths (see run-s-pipeline.sh).
SPARK_MASTER=auto
LOCAL_CORES=4
LOCAL_DRIVER_MEMORY=6g

# Experiment A observability: a plain-text Spark event log and mapred job -status per job.
SPARK_EVENT_LOG=false
MR_COUNTERS=false

# MapReduce demand settings, 0 = not passed (the jobs keep their own defaults). The
# partition count is the reducer count of every stage, so it sets how many reduce
# containers each job asks YARN for; the split size sets the map count of the DBLP XML;
# the container sizes decide how many containers fit on a node. They exist to make
# pending YARN demand for Experiment B and are never set for a plain run.
PARTITION_COUNT=0
SPLIT_MAX_BYTES=0
MAP_MEMORY_MB=0
REDUCE_MEMORY_MB=0

# Profile a-baseline (Experiment A, single node): observability only. The paths are
# pinned, not left to auto: A is file:/// on the primary with Spark on YARN, the shape of
# S run 6, whatever the cluster looks like.
a-baseline.SPARK_EVENT_LOG=true
a-baseline.MR_COUNTERS=true
a-baseline.DATA_PATH=file
a-baseline.SPARK_MASTER=yarn

# Profile b-burst (Experiment B, a core node and a scaling cap of 4). PROPOSED values, to
# be confirmed by the experiment owner before the run: 16 reducers per stage, 128 KiB DBLP
# splits (the DBLP subset is about 2 MB), and 3 GiB containers so that fewer than the node
# memory allows run at once and the rest queue. The node manager memory on an m5.xlarge is
# not read here (UNVERIFIED).
# The paths are pinned (review 1, M1): MapReduce on HDFS across the core nodes, Spark and
# export as local[N] on the primary. With DATA_PATH=hdfs forced, run-s-pipeline.sh waits a
# bounded time (NM_WAIT_SECONDS, default 300) for a NodeManager on another host and then
# FAILS with a clear message when none registered; it never falls back to file:///.
# P15-16 (M2): 8 Spark shuffle partitions (not 32; the Spark stages run local[N] on the
# primary) and no Spark event log for B (the event log is Experiment A's evidence; for B
# the evidence is the MapReduce counters and the CloudWatch metrics).
b-burst.DATA_PATH=hdfs
b-burst.SPARK_MASTER=local
b-burst.SPARK_EVENT_LOG=false
b-burst.MR_COUNTERS=true
b-burst.SHUFFLE_PARTITIONS=8
b-burst.PARTITION_COUNT=16
b-burst.SPLIT_MAX_BYTES=131072
b-burst.MAP_MEMORY_MB=3072
b-burst.REDUCE_MEMORY_MB=3072
