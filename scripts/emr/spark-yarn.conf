# Settings read by scripts/emr/lib-emr.sh (conf_value). KEY=VALUE, never sourced.
# Uploaded to bootstrap/spark-yarn.conf by scripts/upload-inputs.sh and copied to the
# node by the fetch step. Edit it (a reviewed change) after reading capability.json.

# spark.yarn.populateHadoopClasspath for the pipeline. The capability check tests both;
# false keeps EMR's Hadoop 3.4.1 and EMR library directories off the Spark 4 containers.
POPULATE_HADOOP_CLASSPATH=false

# client keeps the driver on the primary node, where its output is in the step log.
DEPLOY_MODE=client

# m5.xlarge has 4 vCPUs and 15,791 MB and also runs the Hadoop daemons, and the client
# mode driver runs on the same node. Work order 49: two executors of 2 cores use all 4
# vCPUs (S run 3 used one executor, 2 of 4). Memory, per YARN container (heap plus
# the default overhead of max(384 MB, 10 percent)):
#   executor 3g = 3072 + 384 = 3456 MB, two = 6912 MB
#   application master 1g = 1024 + 384 = 1408 MB
#   total asked of the node manager 8320 MB. S run 3 saw one 4g executor container of
#   4505 MB. The node manager limit is not read here (EMR's m5.xlarge default is
#   believed to be 12288 MB, UNVERIFIED on this node); 8320 fits under it, and
#   under any limit of 8320 MB or more. The driver (2g) and the daemons share the
#   rest of the 15,791 MB, which is why the executors are 3g and not 4g: two 4g
#   containers (9010 MB) plus the AM (1408 MB) would ask 10,418 MB and leave too little
#   for the driver and the daemons. If the limit is lower than 8320 MB, set
#   EXECUTOR_MEMORY=2g (two containers 4864 MB plus the AM, 6272 MB).
DRIVER_MEMORY=2g
AM_MEMORY=1g
EXECUTOR_MEMORY=3g
EXECUTOR_CORES=2
EXECUTOR_INSTANCES=2
