      "subset_rule": "Two streaming passes over the verified local DBLP dump in file order, stopping at 12884901888 decompressed bytes or 12000000 records. Pass one keeps every work, in any year and with or without a DOI, that has an author whose name (ignoring DBLP's numeric homonym suffix) folds to a seed name, dropping works with more than 25 authors; at most 200 works are kept for each seed name, where the per-name count is the number of works in the subset file that mention that name (a work with two seed names counts for both; coauthor works mention none). Works are admitted in order of the smallest SHA-256 of salt and DBLP key, skipping any work that would push a name over its cap. Pass two keeps works with no seed-name author that have an author who is, by exact DBLP name, a non-seed coauthor of a kept seed work (one hop; at most 4000 coauthor names, smallest SHA-256 first), the 1500 smallest by the same ranking. The total never exceeds 3500 works; seed works have priority. Ranking is a fixed-salt hash, so the result does not depend on record order or on randomness. OpenAlex, Crossref and ORCID rows are added afterwards for works with a DOI (seed works first) and never remove a work.",
      "linkage_keys": [
