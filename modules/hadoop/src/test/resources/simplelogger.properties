# Test-scope logging for the hadoop module.
#
# Why this file exists: `slf4j-simple` defaults to INFO, and Hadoop's
# `LocalJobRunner` emits roughly twenty lines of map-output-buffer internals per
# map task. With several splits per job and several jobs per suite that is
# thousands of lines, and it truncated the first two attempts at run 7 before
# the test summary was printed.
#
# WARN rather than ERROR, deliberately. The point of having an SLF4J binding on
# the test classpath is that real diagnostics reach the output: task failure
# stacks, output-committer problems and the FileAlreadyExistsException the
# rerun-policy case depends on all surface at WARN or above. Silencing to ERROR
# would trade one debugging problem for a worse one.
org.slf4j.simpleLogger.defaultLogLevel=warn

# Keep what does get logged compact and attributable.
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
